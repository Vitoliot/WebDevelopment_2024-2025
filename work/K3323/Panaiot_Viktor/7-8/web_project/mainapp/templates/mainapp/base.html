{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}My Project{% endblock %}</title>

  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Наши доп. стили -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  <!-- Наши доп. стили -->
  <link rel="stylesheet" href="{% static 'css/map.css' %}">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #212529; /* темно-серый для текста */
    }
  </style>

  {% block head %}{% endblock %}
</head>
<body>

  <!-- Навигационная панель -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom"
       style="border-color:#CED4DA !important;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="{% url 'index' %}">
        <!-- Пример монохромной иконки (Bootstrap Icons) -->
        <i class="bi bi-globe me-2" style="font-size:24px;"></i>
        <span style="font-size:20px; font-weight:500;">My Project</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
               href="{% url 'index' %}">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
               href="{% url 'about' %}">О разработке</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
               href="{% url 'contact' %}">Обратная связь</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.resolver_match.url_name == 'map_page' %}active{% endif %}"
               href="{% url 'map_page' %}">Карта</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Контент -->
  <div class="container my-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Футер -->
  <footer class="container py-3 border-top" style="border-color:#CED4DA !important;">
    <p class="mb-0">&copy; 2025. Пример учебного проекта на Django</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
